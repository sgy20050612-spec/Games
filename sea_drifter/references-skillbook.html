<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>成长技能书 · 动画演示</title>
<style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#34515a,#10242d 65%);color:#e8d4aa;font-family:'Microsoft YaHei',sans-serif}main{max-width:1180px;margin:24px auto;padding:22px;border:12px ridge #795637;background:repeating-linear-gradient(4deg,#3c2b20,#493524 5px,#39291e 8px);box-shadow:0 20px 70px #0008}header{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}h1{margin:0;color:#f1dcaf}button{font:inherit;color:inherit;cursor:pointer}header span{padding:12px;background:#14232b;border:2px solid #97784d}#board{position:relative;display:grid;grid-template-columns:1fr 1fr 1fr;gap:22px;margin-top:20px;background:#121d25;padding:18px;border:3px solid #705337}section{min-width:0;z-index:1}h2{text-align:center;margin:0 0 14px;padding:10px 4px;background:#9c7b50;color:#201f1b;font-size:19px;border:3px ridge #b89a6b}.row{height:103px;display:flex;align-items:center;justify-content:center;position:relative}.node{width:90%;min-height:77px;border:2px solid #69716f;background:linear-gradient(140deg,#343936,#19232a);padding:10px;border-radius:6px;filter:grayscale(1);text-align:left;transition:border-color .4s,box-shadow .4s,filter .4s,transform .25s;position:relative}.node:hover{transform:translateY(-3px)}.node:focus-visible{outline:3px dashed #f1e2b5;outline-offset:4px}.node b{display:block;font-size:17px}.node small{display:block;margin-top:7px;color:#c6c7b7}.node .book{float:left;margin-right:12px;font-size:30px;line-height:48px}.tech{--glow:#58cafa}.resident{--glow:#f2cf5d}.mixed{--glow:#ed6959}.node.unlocked{filter:none;border-color:var(--glow);box-shadow:0 0 11px color-mix(in srgb,var(--glow) 60%,transparent),inset 0 0 14px #ffffff09}.node.pulse{animation:openbook .65s ease-out}.node:not(.unlocked)::after{content:'◇';position:absolute;right:10px;bottom:7px;color:#899291}.node.unlocked::after{content:'✓';position:absolute;right:10px;bottom:7px;color:var(--glow)}.node.shake{animation:shake .35s}.divider{height:33px;background:repeating-linear-gradient(2deg,#66452b,#8b6138 4px,#493321 7px);border-block:3px solid #b49461;position:relative;z-index:3;margin:3px -18px 4px;text-align:center;color:#f4dfb2;font-size:13px;line-height:27px}.row.arrow:after{content:'↓';position:absolute;bottom:-8px;left:49%;color:#776e58;font-size:22px;z-index:2;transition:color .4s}.row.lit:after{color:#ddbc77}.empty{height:103px}#links{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}.beam{stroke:#6c736e;stroke-width:2;fill:none;transition:stroke .5s}.beam.lit{stroke:#e1b674;stroke-dasharray:7 4;animation:flow 1s linear infinite}.glow-spark{position:absolute;inset:-8px;border:2px solid var(--glow);border-radius:10px;pointer-events:none;animation:spark .7s forwards}footer{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-top:15px}footer button{background:#bf9e68;color:#25241b;border:2px solid #705336;padding:9px 14px;border-radius:4px}#status{flex:1;min-width:200px}.legend{font-size:12px;color:#bdbca9;margin-top:12px}dialog{background:#14232b;color:#e8d4aa;border:3px ridge #99784d;max-width:400px;padding:24px}dialog::backdrop{background:#0009}dialog button{padding:8px 16px;background:#a78d61;color:#161e22;border:0;margin-top:18px}@keyframes openbook{0%{transform:scale(.93) rotateY(-30deg)}45%{transform:scale(1.06) rotateY(8deg)}100%{transform:scale(1)}}@keyframes spark{to{inset:-28px;opacity:0}}@keyframes flow{to{stroke-dashoffset:-22}}@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}@media(max-width:700px){main{margin:6px;padding:9px;border-width:6px}#board{gap:6px;padding:8px}.node{width:98%;padding:6px}.node b{font-size:12px}.node small{font-size:10px}.node .book{float:none;font-size:24px;line-height:28px;display:block}.row{height:125px}.empty{height:125px}h2{font-size:13px;padding:7px 0}.divider{margin-inline:-8px;font-size:11px}.node{min-height:104px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
<main><header><h1>成长技能书</h1><span>可用能力点 <strong id="points">40</strong></span></header><div id="board"><svg id="links" aria-hidden="true"></svg></div><footer><span id="status" aria-live="polite">点击第二级技能书，开始解锁。</span><button id="demo">播放混合解锁示范</button><button id="reset">重置</button></footer><div class="legend">蓝：科技 · 红：混合 · 黄：居民 · 灰：未解锁。示例总预算 40 点；混合能力仅演示双前置与动画，不消耗能力点，实际效果待策划确定。</div></main>
<dialog id="details"><h2 id="detail-title"></h2><p id="detail-text"></p><button id="close">返回技能书</button></dialog>
<script>
(()=>{'use strict';const board=document.getElementById('board'),links=document.getElementById('links'),status=document.getElementById('status'),points=document.getElementById('points');
const names={tech:['基础工具','防御工事','火炮','迫击炮','电力','自动化'],resident:['聚落','训练','聚居','精训','守望','英雄']},cost=[0,3,5,7,9,11],roman=['Ⅰ','Ⅱ','Ⅲ','Ⅳ','Ⅴ','Ⅵ'];
const effects={tech:['默认开启：采集与基础工事','解锁防御塔、通讯塔与通讯兵岗位','解锁火炮塔；所有塔伤害 +15%','解锁迫击炮塔；所有塔射程 +10%','采集、建造、修复速度 +30%；交通时间 ×0.7','防御设施免费修复50%缺口；塔攻速 +10%'],resident:['默认开启：居民系统与8名居民上限','全体居民属性 +15%','居民上限 +4；每岛岗位槽 +1','全体居民属性再 +30%；主动技能冷却 −25%','完美防御奖励翻倍；居民上限 +8','一名战斗居民觉醒英雄；驻岛战斗居民伤害 +25%']};
let level={tech:0,resident:0},mixed=new Set(),budget=40,timers=[],nodes={};
function build(){for(const type of ['tech','mixed','resident']){const section=document.createElement('section');section.className=type;const heading=document.createElement('h2');heading.textContent={tech:'科技技能书',mixed:'混合技能书',resident:'居民技能书'}[type];section.append(heading);for(let i=0;i<6;i++){const row=document.createElement('div');row.className='row'+(type!=='mixed'&&i<5?' arrow':'');if(type==='mixed'&&(i===0||i>3)){row.classList.add('empty')}else{const button=document.createElement('button');button.type='button';button.className='node '+type;button.id=type+'-'+i;const name=type==='mixed'?'混合能力 '+roman[i-1]:names[type][i];button.innerHTML='<span class="book" aria-hidden="true">'+(type==='tech'?'▤':type==='mixed'?'▥':'▣')+'</span><b>'+roman[i]+' '+name+'</b><small></small>';button.addEventListener('click',()=>activate(type,i));nodes[button.id]=button;row.append(button)}section.append(row);if(i===3){const d=document.createElement('div');d.className='divider';d.textContent=type==='mixed'?'第四级分界':'━━';section.append(d)}}board.append(section)}render()}
function unlocked(type,i){return type==='mixed'?mixed.has(i):i<=level[type]}
function ready(type,i){return type==='mixed'?level.tech>=i&&level.resident>=i:i===level[type]+1}
function render(){points.textContent=budget;for(const [id,node]of Object.entries(nodes)){const [type,n]=id.split('-'),i=+n,isOpen=unlocked(type,i);node.classList.toggle('unlocked',isOpen);node.setAttribute('aria-label',(type==='mixed'?'混合能力 '+roman[i-1]:names[type][i])+'，'+(isOpen?'已解锁':'未解锁'));node.querySelector('small').textContent=type==='mixed'?(isOpen?'已解锁 · 效果待定义':ready(type,i)?'双前置已满足 · 点击解锁':'需左右同级解锁'):isOpen?(i===0?'默认开启':'已解锁 · '+cost[i]+' 点'):cost[i]+' 点 · '+(ready(type,i)?'可解锁':'前置未满足');node.parentElement.classList.toggle('lit',isOpen)}requestAnimationFrame(drawLinks)}
function flash(node){node.classList.remove('pulse');void node.offsetWidth;node.classList.add('pulse');const spark=document.createElement('i');spark.className='glow-spark';node.append(spark);setTimeout(()=>spark.remove(),750)}
function reject(node,msg){status.textContent=msg;node.classList.remove('shake');void node.offsetWidth;node.classList.add('shake')}
function activate(type,i){const node=nodes[type+'-'+i];if(unlocked(type,i)){document.getElementById('detail-title').textContent=type==='mixed'?'混合能力 '+roman[i-1]:names[type][i];document.getElementById('detail-text').textContent=type==='mixed'?'本节点为交互示意，实际名称、能力、费用尚待策划确认。':effects[type][i];document.getElementById('details').showModal();return false}if(!ready(type,i)){reject(node,type==='mixed'?'请先解锁左右两侧的同级技能。':'请按从上到下的顺序解锁。');return false}if(type!=='mixed'&&budget<cost[i]){reject(node,'能力点不足：需要 '+cost[i]+' 点。');return false}if(type==='mixed'){mixed.add(i);status.textContent='混合能力 '+roman[i-1]+' 已解锁：双前置汇合，红色高光亮起。'}else{budget-=cost[i];level[type]=i;status.textContent=names[type][i]+' 已解锁，消耗 '+cost[i]+' 点。'}render();flash(node);return true}
function drawLinks(){const origin=board.getBoundingClientRect();links.setAttribute('viewBox','0 0 '+origin.width+' '+origin.height);links.innerHTML='<defs><marker id="tip" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b59a69"/></marker></defs>';for(let i=1;i<=3;i++){const m=nodes['mixed-'+i].getBoundingClientRect();for(const type of ['tech','resident']){const a=nodes[type+'-'+i].getBoundingClientRect(),from=type==='tech'?a.right:a.left,to=type==='tech'?m.left:m.right;const line=document.createElementNS('http://www.w3.org/2000/svg','path');line.setAttribute('d','M '+(from-origin.left)+' '+(a.top+a.height/2-origin.top)+' L '+(to-origin.left)+' '+(m.top+m.height/2-origin.top));line.setAttribute('class','beam'+(level[type]>=i?' lit':''));line.setAttribute('marker-end','url(#tip)');links.append(line)}}}
function reset(){timers.forEach(clearTimeout);timers=[];level={tech:0,resident:0};mixed.clear();budget=40;status.textContent='点击第二级技能书，开始解锁。';if(document.getElementById('details').open)document.getElementById('details').close();render()}
document.getElementById('reset').onclick=reset;document.getElementById('demo').onclick=()=>{reset();const steps=[['tech',1],['resident',1],['mixed',1],['tech',2],['resident',2],['mixed',2],['tech',3],['resident',3],['mixed',3]];steps.forEach(([type,i],n)=>timers.push(setTimeout(()=>activate(type,i),500+n*1000)))};document.getElementById('close').onclick=()=>document.getElementById('details').close();window.addEventListener('resize',drawLinks);build();new ResizeObserver(drawLinks).observe(board);
})();
</script></html>
