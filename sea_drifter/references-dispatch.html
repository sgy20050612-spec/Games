<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>居民调度 · 设施分配版（历史交互原型）</title>
<style>body{margin:0;background:#122a32;color:#ecd7ae;font-family:'Microsoft YaHei',sans-serif}main{max-width:1320px;margin:24px auto;padding:18px;border:10px ridge #86613e;background:repeating-linear-gradient(3deg,#493524,#36271e 7px,#503927 9px)}header,footer{display:flex;align-items:center;gap:18px;flex-wrap:wrap}h1{flex:1;margin:4px 0 15px}button{font:inherit;background:#c3a474;color:#23231b;padding:9px 15px;border:2px solid #80633e}canvas{width:100%;display:block;touch-action:none;background:#13212a}footer{padding:16px 0 4px}#status{flex:1;min-width:240px}small{display:block;color:#b9b59e;margin-top:12px}label{padding:8px;background:#233530}button:focus-visible,input:focus-visible{outline:3px solid #e8cc81}</style>
<main><header><h1 id="title">居民调度 · 群岛总览</h1><button id="back" hidden>返回群岛总览</button><label><input id="unlock" type="checkbox">解锁自由调度（演示能力）</label><button id="reset">重置</button></header><canvas width="1260" height="700" aria-label="左侧为无业居民，中央三职业，右侧岛名。点击职业空白处进入设施分配界面。">请使用支持Canvas的浏览器。</canvas><footer><span id="status" aria-live="polite">将左侧无业居民拖到本岛职业格子。点击职业格空白处或右下角入口，打开设施分配。</span><span id="total"></span></footer><small>按住居民播放跑动动画；松开后提交调度。设施页从待分配区拖到设施，或在设施间拖动；每设施示例容量4人。自由调度解锁后才可跨岛/转职，跨岛演示航程2秒。设施与容量均为交互示例，不代表策划案定稿。</small></main>
<script>
(()=>{'use strict';const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),status=document.getElementById('status'),titles=document.getElementById('title');const roles=['建造生产','资源收集','战斗'],islands=['主岛','副岛 A','副岛 B'],colors=['#c49a64','#669e9b','#b86651'];let people=[],drag=null,hover=null,page=null,down=null,hits=[];let unlocked=false;const ox=210,oy=90,cw=280,ch=185;
function rect(x,y,w,h,color){ctx.fillStyle=color;ctx.fillRect(Math.round(x),Math.round(y),w,h)}function text(t,x,y,size=18,color='#ead5ac'){ctx.fillStyle=color;ctx.font=`${size}px "Microsoft YaHei",sans-serif`;ctx.fillText(t,x,y)}
function sprite(x,y,role,t,running=false,alpha=1){ctx.save();ctx.globalAlpha=alpha;ctx.translate(Math.round(x),Math.round(y));ctx.scale(1.8,1.8);let s=running?Math.sin(t*18):0,b=running?Math.abs(s)*2:Math.sin(t*2)*.4;
rect(-10,-2,22,3,'#050e1755');ctx.translate(0,-b);let leg=(offset,phase)=>{ctx.strokeStyle='#302e30';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(offset,-12);ctx.lineTo(offset+phase*7,-5);ctx.lineTo(offset-phase*4,0);ctx.stroke();rect(offset-phase*4-2,-1,7,3,'#806349')};leg(-4,s);leg(4,-s);
rect(-8,-29,16,18,colors[role]);rect(-6,-25,12,10,role===0?'#d8bd8c':role===1?'#728b7e':'#6e6555');rect(-8,-14,16,3,'#554236');rect(-6,-43,13,15,'#d5b38a');rect(-8,-46,15,7,role===1?'#427277':'#493c31');rect(-9,-42,4,11,role===1?'#427277':'#493c31');rect(4,-39,2,2,'#252e34');rect(-3,-45,9,2,role===1?'#759d9b':'#7d5e3c');
ctx.strokeStyle='#c7a47b';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(-5,-26);ctx.lineTo(-12+s*5,-15);ctx.moveTo(5,-26);ctx.lineTo(12-s*5,-17);ctx.stroke();
if(role===0){rect(12-s*5,-32,2,21,'#a28154');rect(7-s*5,-34,13,6,'#a4b4b2');rect(-5,-26,9,15,'#a87d49')}
if(role===1){rect(-16,-30,9,20,'#98773d');for(let i=0;i<3;i++)rect(-16,-27+i*5,9,1,'#c9a96c');rect(-15,-35,4,7,'#74924f');rect(-10,-36,4,8,'#aac05c')}
if(role===2){rect(-8,-30,17,4,'#bb6750');rect(-13,-30,4,13,'#914b40');ctx.strokeStyle='#bd9c67';ctx.lineWidth=2;ctx.beginPath();ctx.arc(12,-22,12,-1.2,1.2);ctx.stroke();ctx.strokeStyle='#e5d1a7';ctx.beginPath();ctx.moveTo(16,-33);ctx.lineTo(16,-11);ctx.stroke()}
ctx.restore();}

function reset(){people=[];let id=1;[[2,1,2],[1,2,1],[1,1,1]].forEach((row,r)=>{for(let k=0;k<3;k++)people.push({id:id++,island:r,role:-1,job:-1,trip:0});row.forEach((n,c)=>{for(let j=0;j<n;j++)people.push({id:id++,island:r,role:c,job:-1,trip:0})})});page=null;drag=null;hover=null;unlocked=false;document.getElementById('unlock').checked=false;nav();status.textContent='无业居民可在本岛选择职业；已定职业暂不可更换。'}
function nav(){titles.textContent=page?islands[page.r]+' · '+roles[page.c]+' · 设施分配':'居民调度 · 群岛总览';document.getElementById('back').hidden=!page}
function region(x,y){if(!page){let r=Math.floor((y-oy)/ch);if(r<0||r>2)return null;if(x>=12&&x<200)return{r,c:-1};let c=Math.floor((x-ox)/cw);return c>=0&&c<3?{r,c}:null}if(y<140||y>620)return null;if(x<200&&x>=12)return{job:-1};let j=Math.floor((x-ox)/cw);return j>=0&&j<3?{job:j}:null}
function members(target){return people.filter(p=>page?p.island===page.r&&p.role===page.c&&p.job===target.job:p.island===target.r&&p.role===target.c)}
function frame(x,y,w,h,title,selected){rect(x,y,w,h,'#14212a');ctx.strokeStyle=selected?'#c5d98c':'#8b7049';ctx.lineWidth=selected?3:2;ctx.strokeRect(x,y,w,h);if(title)text(title,x+15,y+27,19,selected?'#e7e6ae':'#d4bd95')}
function renderCell(target,x,y,w,h,now,plain=false){if(!plain)frame(x,y,w,h,'',JSON.stringify(hover)===JSON.stringify(target));const group=members(target);text(group.length+' 人'+(page&&target.job>=0?' / 4':''),x+12,y+26,15,'#aaa996');group.forEach((p,i)=>{let cols=page?3:target.c===-1?2:3;let px=x+40+(i%cols)*(w-70)/Math.max(1,cols-1),py=y+111+Math.floor(i/cols)*60;if(py>y+h-8)return;hits.push({p,x:px,y:py});if(drag&&drag.p===p){ctx.strokeStyle='#b49e69';ctx.setLineDash([4,4]);ctx.strokeRect(px-17,py-78,34,80);ctx.setLineDash([]);return}if(p.role===-1){rect(px-9,py-40,18,27,'#7c8177');rect(px-7,py-59,14,16,'#d2b38a');rect(px-10,py-64,18,6,'#665341');rect(px-8,py-13,6,13,'#343d40');rect(px+2,py-13,6,13,'#343d40')}else sprite(px,py,p.role,now/1000,false,p.trip>now?.35:1);text('#'+p.id,px-12,py+15,11,'#9ba5a2');if(p.trip>now)text('航行中',px-24,py-76,12,'#91c7cc')});return group}
function draw(now){ctx.clearRect(0,0,1260,700);hits=[];if(!page){frame(12,15,188,58,'无业居民');roles.forEach((r,c)=>frame(ox+c*cw,15,cw-10,58,r));frame(1055,15,192,58,'岛屿编号 / 名称');frame(12,oy,188,ch*3-10,'');for(let r=0;r<3;r++){text(islands[r],25,oy+r*ch+48,14,'#c8b276');renderCell({r,c:-1},12,oy+r*ch,188,ch-10,now,true);roles.forEach((role,c)=>{renderCell({r,c},ox+c*cw,oy+r*ch,cw-10,ch-10,now);text('查看设施 ›',ox+c*cw+165,oy+r*ch+ch-22,13,'#c8b276')});frame(1055,oy+r*ch,192,ch-10,'');text('岛屿 0'+(r+1),1075,oy+r*ch+55,18);text(islands[r],1075,oy+r*ch+93,25)}}else{frame(12,30,188,78,'待分配');let labels=page.c===0?['工厂 1','工厂 2','工厂 3']:page.c===1?['伐木场','采石场','农场']:['防御塔 1','防御塔 2','驻守点'];labels.forEach((s,j)=>frame(ox+j*cw,30,cw-10,78,s));renderCell({job:-1},12,140,188,480,now);for(let j=0;j<3;j++)renderCell({job:j},ox+j*cw,140,cw-10,480,now);text('拖动工人在设施间调度；拖回左侧解除设施指派，不改变职业。',22,662,18)}if(drag){let p=drag.p;if(p.role<0){sprite(drag.x,drag.y,0,now/1000,true);text('无业居民',drag.x-30,drag.y-91,14)}else sprite(drag.x,drag.y,p.role,now/1000,true)}document.getElementById('total').textContent='居民总数 '+people.length+' · 无业 '+people.filter(p=>p.role<0).length;requestAnimationFrame(draw)}
function commit(target){let p=drag.p;if(!target){status.textContent='落点无效，已返回原位。';return}if(page){if(target.job>=0&&members(target).filter(q=>q!==p).length>=4){status.textContent='设施已满，调度取消。';return}p.job=target.job;status.textContent='居民 '+p.id+' 已'+(p.job<0?'回到待分配区。':'指派到设施 '+(p.job+1)+'。');return}if(target.c<0){status.textContent='已定职业居民不可直接退回无业区。';return}if(!unlocked&&(p.island!==target.r||(p.role!==-1&&p.role!==target.c))){status.textContent='尚未解锁自由调度：仅能将无业居民分配至本岛职业。';return}if(p.island!==target.r||p.role!==target.c)p.job=-1;let cross=p.island!==target.r;p.role=target.c;p.island=target.r;p.trip=cross?performance.now()+2000:0;status.textContent='居民 '+p.id+' 已成为'+islands[p.island]+'的'+roles[p.role]+'居民'+(cross?'，乘船前往中。':'。点击该职业格查看设施。')}
function point(e){let r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*1260/r.width,y:(e.clientY-r.top)*700/r.height}}
canvas.addEventListener('pointerdown',e=>{let a=point(e);down=a;const hit=[...hits].reverse().find(h=>Math.abs(a.x-h.x)<28&&a.y>h.y-84&&a.y<h.y+8&&h.p.trip<=performance.now());if(hit){drag={p:hit.p,...a};canvas.setPointerCapture(e.pointerId);e.preventDefault()}});canvas.addEventListener('pointermove',e=>{if(!drag)return;Object.assign(drag,point(e));hover=region(drag.x,drag.y)});canvas.addEventListener('pointerup',e=>{let a=point(e);if(drag){commit(region(a.x,a.y));drag=null;hover=null}else if(!page&&down&&Math.hypot(a.x-down.x,a.y-down.y)<8){let cell=region(a.x,a.y);if(cell&&cell.c>=0){page=cell;nav();status.textContent='上方为设施名称，下方拖拽分配工人。'}}down=null});canvas.addEventListener('pointercancel',()=>{drag=null;hover=null;down=null;status.textContent='已取消拖拽。'});document.getElementById('unlock').onchange=e=>{unlocked=e.target.checked;status.textContent=unlocked?'已解锁：允许跨岛、跨职业调度，转职立即换装。':'已关闭自由调度：现有分配保留，后续受初期规则限制。'};document.getElementById('back').onclick=()=>{page=null;drag=null;hover=null;nav()};document.getElementById('reset').onclick=reset;reset();requestAnimationFrame(draw);
})();</script></html>
